{% extends "base.html" %}

{% block title %}Iniciar Sesión - TB Detection{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="fas fa-lock me-2"></i>Acceso Médicos</h4>
                </div>
                <div class="card-body p-4">
                    <div id="login-alert" class="alert alert-danger d-none"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <p class="mb-0">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    $(document).ready(function () {
        $('#login-form').on('submit', function (e) {
            e.preventDefault();
            const alert = $('#login-alert');
            alert.addClass('d-none');

            $.ajax({
                url: "{{ url_for('auth.login') }}",
                method: 'POST',
                data: $(this).serialize(),
                success: function (response) {
                    window.location.href = "{{ url_for('main.dashboard') }}";
                },
                error: function (xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.error : 'Error al iniciar sesión';
                    alert.text(error).removeClass('d-none');
                }
            });
        });
    });
</script>
{% endblock %}
