{% extends "base.html" %}

{% block title %}Registro de Médico - TB Detection{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="fas fa-user-md me-2"></i>Registro de Médico</h4>
                </div>
                <div class="card-body p-4">
                    <div id="register-alert" class="alert d-none"></div>

                    <form id="register-form">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Institucional</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="especialidad" class="form-label">Especialidad</label>
                            <input type="text" class="form-control" id="especialidad" name="especialidad"
                                placeholder="Ej. Radiología, Neumología">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-check-circle me-2"></i>Completar Registro
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <p class="mb-0">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    $(document).ready(function () {
        $('#register-form').on('submit', function (e) {
            e.preventDefault();
            const alert = $('#register-alert');
            alert.addClass('d-none').removeClass('alert-danger alert-success');

            $.ajax({
                url: "{{ url_for('auth.register') }}",
                method: 'POST',
                data: $(this).serialize(),
                success: function (response) {
                    alert.text(response.message).addClass('alert-success').removeClass('d-none');
                    setTimeout(() => {
                        window.location.href = "{{ url_for('auth.login') }}";
                    }, 2000);
                },
                error: function (xhr) {
                    const error = xhr.responseJSON ? xhr.responseJSON.error : 'Error al registrar usuario';
                    alert.text(error).addClass('alert-danger').removeClass('d-none');
                }
            });
        });
    });
</script>
{% endblock %}
